name: Checks
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Tests of the data space job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-6 libxext6 libxrender1 libgl1 libexpat1
          pip install -r requirements-job.txt pytest
      - name: Tests
        run: |
          export SUMO_HOME="$(python -c 'import sumo, os; print(os.path.dirname(sumo.__file__))')"
          python -m pytest -q tests
