name: Publish image
# Builds and publishes, when a v* tag is pushed (git tag v1.0 && git push origin v1.0):
# - ghcr.io/<owner>/urban-mobility:<tag>       the CitCom data space job (Dockerfile.job)
# - ghcr.io/<owner>/urban-mobility-twin:<tag>  the Urban Mobility Digital Twin service (Dockerfile.twin)
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    name: Build and push ${{ matrix.suffix || 'job' }} to GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: Dockerfile.job
            suffix: ""
          - file: Dockerfile.twin
            suffix: "-twin"
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
